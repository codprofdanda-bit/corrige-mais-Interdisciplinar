<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrige+ — Elaborador e corretor de provas</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2740;--mute:#667089;--rule:#d5dae6;--pen:#d6283a;--ok:#1c7a58;--ok-bg:#e3f4ec;--bad-bg:#fbe6e8;--ac:#1c2740;--ac-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--card:#1a2236;--ink:#e8ecf6;--mute:#9aa4bd;--rule:#2d3856;--pen:#ff6b7a;--ok:#5fd3a2;--ok-bg:#16382d;--bad-bg:#3d1c24;--ac:#e8ecf6;--ac-t:#121826}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 64px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
nav{display:flex;gap:4px;border-bottom:2px solid var(--rule);margin-bottom:20px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;font:inherit;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen);font-weight:600}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:9px 10px}
textarea{min-height:60px;resize:vertical}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.opt{display:flex;align-items:center;gap:8px;margin-top:6px}
.opt b{width:20px;text-align:center}
.opt input[type=radio]{accent-color:var(--ok);width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
button.b{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.p{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}
button.d{color:var(--pen)}
button.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:Georgia,serif;font-weight:700}
.pts{width:80px!important}
.tag{font:500 13px system-ui,sans-serif;color:var(--mute);margin:0 0 6px}
.alt{margin:3px 0 0 4px}
.alt.ok{color:var(--ok);font-weight:600}
.in{border-left:4px solid var(--ok)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--rule)}
th{color:var(--mute);font-weight:500;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.qimg{display:block;max-width:100%;max-height:240px;margin:8px 0;border-radius:6px;background:#fff}
details summary{cursor:pointer;color:var(--mute);font-size:14px}
details[open] summary{color:var(--ink);font-weight:600}
.formq{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule)}
.badge{display:inline-block;background:var(--ok-bg);color:var(--ok);padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600;margin-left:6px}
.hdr-prev{margin-top:10px;padding:8px;border:1px dashed var(--rule);border-radius:8px;background:var(--bg)}
.hdr-prev img{display:block;width:100%;max-height:120px;object-fit:contain;background:#fff;border-radius:4px}
.hdr-prev p{margin:0 0 6px;font-size:13px;color:var(--mute)}
.eco-exam .qimg{max-height:70px;margin:3px 0}
.gab-block{margin:6mm 0;font-family:Georgia,serif;font-size:11pt;line-height:1.5;page-break-inside:avoid}
.gab-block h3{margin:0 0 2mm;font-size:13pt}
.gab-list{font-family:Georgia,serif;font-size:11pt;line-height:1.7;column-count:4;column-gap:6mm}
.gab-list .q{break-inside:avoid;display:inline-block;min-width:22mm;margin:0 0 1mm}
.gab-list .q b{display:inline-block;min-width:7mm}
.gab-pts{color:#444;font-size:9pt;margin-left:1mm}

/* ===== Nome principal Corrige+ ===== */
.brand{display:flex;align-items:baseline;margin:8px 0 4px;font-family:Georgia,"Times New Roman",serif;line-height:1;letter-spacing:-0.5px}
.brand-name{font:800 38px/1 Georgia,"Times New Roman",serif;background:linear-gradient(120deg,#6d28d9 0%,#a855f7 45%,#ec4899 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 4px rgba(109,40,217,.18))}
.brand-plus{font:900 48px/1 Georgia,"Times New Roman",serif;color:#ff2d55;text-shadow:0 4px 16px rgba(255,45,85,.55),0 0 28px rgba(255,45,85,.3);margin-left:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-name{background:linear-gradient(120deg,#c4b5fd 0%,#e879f9 45%,#f9a8d4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}:root:not([data-theme="light"]) .brand-plus{color:#ff6b8a;text-shadow:0 4px 16px rgba(255,107,138,.6),0 0 28px rgba(255,107,138,.35)}}

/* ===== Alternativas na mesma linha (quando couberem) ===== */
.alts-inline{display:flex;flex-wrap:wrap;gap:0 14px;margin:3px 0 0 4px}
.alts-inline .alt{margin:0}

/* ===== host de medição ===== */
.measure-host{position:absolute;left:-99999px;top:0;background:#fff;color:#000;box-sizing:border-box;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.measure-host.m-exam{width:194mm}
.measure-host.m-eco{width:194mm;padding:2mm;box-sizing:border-box}
.measure-host .hdr-print{font:12px system-ui;margin-bottom:4mm;border-bottom:1px solid #000;padding-bottom:3mm}
.measure-host .hdr-print h2{font:700 18px Georgia,serif;margin:0}
.measure-host .hdr-print p{margin:2px 0 0}
.measure-host .hdr-print img{display:block;width:100%;max-height:38mm;object-fit:contain}
.measure-host .exam-block.card,
.measure-host .exam-block{margin:0;padding:0;border:0;background:#fff;border-radius:0}
.measure-host .exam-block h2{font:700 20px Georgia,serif;margin:0 0 6px}
.measure-host .exam-block ol{padding-left:22px;margin:0}
.measure-host .exam-block li{margin-bottom:14px}
.measure-host .exam-block .alt{margin:2px 0 0 4px}
.measure-host .alts-inline{display:flex;flex-wrap:wrap;gap:0 14px;margin:2px 0 0 4px}
.measure-host .alts-inline .alt{margin:0}
.measure-host .qimg{display:block;max-width:100%;max-height:240px;margin:8px 0}
.measure-host.m-eco .eco-exam{column-count:2;column-gap:6mm;font-size:9.5pt;line-height:1.25}
.measure-host.m-eco .eco-exam ol{list-style-position:inside;padding-left:0;margin:0}
.measure-host.m-eco .eco-exam li{border:0.5pt solid #000;padding:1.2mm 1.5mm;margin-bottom:2.5mm;break-inside:avoid}
.measure-host.m-eco .eco-exam .qimg{max-height:70px;margin:3px 0}
.measure-host.m-eco .eco-card{margin-top:4mm;border:0.5pt solid #000;box-sizing:border-box}

/* ===== impressão ===== */
@media print{
  nav,.noprint,h1,.sub,.brand{display:none!important}
  main{padding:0;max-width:none}
  body{background:#fff;color:#000}
  .pg{page-break-after:always;page-break-inside:avoid}
  .pg:last-child{page-break-after:auto}
  .blank-page{width:194mm;min-height:281mm}
  .sheet-page{width:194mm;min-height:281mm;padding:0;box-sizing:border-box;display:grid;gap:5mm;page-break-after:always;page-break-inside:avoid}
  .sheet-page:last-child{page-break-after:auto}
  .sheet-1{grid-template-columns:1fr;grid-template-rows:1fr}
  .sheet-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .sheet-8{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr)}
  .slot{display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}
  .eco-page{width:194mm;min-height:281mm;padding:2mm;box-sizing:border-box;display:flex;flex-direction:column;page-break-after:always}
  .eco-page:last-child{page-break-after:auto}
  .eco-head{flex:0 0 auto}
  .eco-exam{flex:0 0 auto;column-count:2;column-gap:6mm;font-size:9.5pt;line-height:1.25}
  .eco-exam ol{list-style-position:inside;padding-left:0;margin:0}
  .eco-exam li{border:0.5pt solid #000;padding:1.2mm 1.5mm;margin-bottom:2.5mm;break-inside:avoid}
  .eco-exam .qimg{max-height:70px;margin:3px 0}
  .eco-card{flex:0 0 auto;display:flex;align-items:center;justify-content:center;margin-top:4mm;page-break-inside:avoid;border:0.5pt solid #000;box-sizing:border-box}
  .eco-page.eco-only{page-break-inside:auto}
  .exam-block.card,.exam-block{padding:0;border:0;background:#fff;border-radius:0;margin:0}
  .exam-block h2{font:700 20px Georgia,serif;margin:0 0 6px}
  .exam-block ol{padding-left:22px}
  .exam-block li{margin-bottom:14px}
  .exam-block .alt{margin:2px 0 0 4px}
  .exam-block .alts-inline{display:flex;flex-wrap:wrap;gap:0 14px;margin:2px 0 0 4px}
  .exam-block .alts-inline .alt{margin:0}
  .hdr-print{font:12px system-ui;margin-bottom:4mm;border-bottom:1px solid #000;padding-bottom:3mm}
  .hdr-print h2{font:700 18px Georgia,serif;margin:0}
  .hdr-print p{margin:2px 0 0}
  .hdr-print img{display:block;width:100%;max-height:38mm;object-fit:contain}
}
@page{size:A4 portrait;margin:8mm}
</style>
</head>
<body>
<main>
<h1 class="brand"><span class="brand-name">Corrige</span><span class="brand-plus">+</span></h1>
<p class="sub">Elaborador e corretor de provas</p>
<nav role="tablist" id="tabs"></nav>
<section id="view"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ===== LETRAS — até 8 alternativas (A–H) ===== */
var LET=["A","B","C","D","E","F","G","H"];
var FACIL="Fácil",MEDIO="Médio",DIFICIL="Difícil";
var NIVEIS=[FACIL,MEDIO,DIFICIL];
var MAX_ALTS=8, MIN_ALTS=2;
function svg(x){return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" '+x+'</svg>')}

/* ===== BANCO — vazio. Formato:
   { n: Nível, d: "Disciplina", s: "Série/ano", t: "Tema",
     q: "Enunciado",
     o: ["Alt A", "Alt B", ... até 8],
     a: 0,
     i: "data:image/svg+xml;..."  // opcional
   }
*/
var BANCO=[];

/* ===== ESTADO ===== */
var S={
 title:"Avaliação",
 qs:[], meu:[],
 turma:{name:"",students:[]},
 vs:null, vm:"qa", vn:1,
 header:{school:"",teacher:"",date:"",image:""},
 evenPages:true,
 altsInline:false
};
var tab="banco", F={t:"",v:"",s:"",d:"",serie:"",n:3}, pm="a", pv=-1;

function load(){
 try{var r=localStorage.getItem("provador8am:state");if(r){var d=JSON.parse(r);if(d&&d.qs){S=d;S.meu=S.meu||[];S.turma=S.turma||{name:"",students:[]};S.header=S.header||{school:"",teacher:"",date:"",image:""};if(!("image" in S.header))S.header.image="";if(!("evenPages" in S))S.evenPages=true;if(!("altsInline" in S))S.altsInline=false}}}
 catch(e){}
}
function save(){try{localStorage.setItem("provador8am:state",JSON.stringify(S))}catch(e){}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(txt,cls,fn){var b=el("button","b "+(cls||""),txt);b.type="button";b.onclick=fn;return b}
function todas(){return BANCO.concat(S.meu)}
function naProva(b){return S.qs.some(function(x){return x.q===b.q})}
function total(){return S.qs.reduce(function(s,q){return s+(+q.p||0)},0)}
function fmt(n){return (Math.round(n*100)/100).toString().replace(".",",")}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function filtradas(){
 var s=F.s.trim().toLowerCase();
 return todas().filter(function(b){
   return (!F.v||b.n===F.v)
     &&(!F.t||b.t===F.t)
     &&(!F.d||(b.d||"")===F.d)
     &&(!F.serie||(b.s||"")===F.serie)
     &&(!s||b.q.toLowerCase().indexOf(s)>-1)
 })
}
function add(b){S.qs.push({q:b.q,o:b.o.slice(),a:b.a,p:1,n:b.n,i:b.i,t:b.t,d:b.d,s:b.s})}
function img(src){var m=el("img","qimg");m.src=src;m.alt="Figura";return m}
function sel(opts,val,ph,fn){
 var s=el("select");var o=el("option",null,ph);o.value="";s.appendChild(o);
 opts.forEach(function(x){
  var isObj = x && typeof x==="object" && x.v!==undefined;
  var v = isObj ? x.v : x;
  var l = isObj ? (x.l!==undefined ? x.l : x.v) : x;
  var e=el("option",null,l);e.value=v;s.appendChild(e)
 });
 s.value=val;s.onchange=function(){fn(s.value)};return s
}
function parseNames(txt){
 return String(txt||"")
  .split(/[\n;]+/)
  .map(function(x){
   return x
    .replace(/^\s*\d+\s*[\.\)\-:]\s*/,'')
    .replace(/^\s*[\-\*•·▪◦]\s*/,'')
    .replace(/\s+/g,' ')
    .trim();
  })
  .filter(Boolean);
}

/* ===== TÍTULO DINÂMICO ===== */
function atualizarTitulo(){
 document.title="Corrige+ — Elaborador e corretor de provas";
 var subEl=document.querySelector(".sub");
 if(subEl)subEl.textContent="Elaborador e corretor de provas";
}

/* ===== MEDIÇÃO REAL DE PÁGINAS ===== */
function measurePages(elm){
 var host=document.createElement("div");
 host.className="measure-host";
 if(elm.classList.contains("eco-page"))host.classList.add("m-eco");
 else host.classList.add("m-exam");
 host.appendChild(elm);
 document.body.appendChild(host);
 var hpx=elm.getBoundingClientRect().height;
 document.body.removeChild(host);
 var mm=hpx/(96/25.4);
 return Math.max(1,Math.ceil(mm/281));
}
function blankPage(){return el("div","blank-page print pg")}

/* ===== VERSÕES ===== */
function nver(){return S.vs&&S.vs.length&&S.vs[0].qo.length===S.qs.length?S.vs.length:1}
function ver(x){
 var d=(S.vs&&S.vs[x]&&S.vs[x].qo.length===S.qs.length)?S.vs[x]:null;
 var qo=d?d.qo:S.qs.map(function(_,i){return i}),ao=d?d.ao:null;
 return qo.map(function(k){
   var q=S.qs[k];
   var origA=(q.a>=0&&q.a<q.o.length)?q.a:0;
   var p=(ao&&ao[k]&&ao[k].length===q.o.length)?ao[k]:null;
   if(!p)p=q.o.map(function(_,i){return i});
   var olist=p.map(function(y){return q.o[y]});
   var aIdx=p.indexOf(origA);
   if(aIdx<0)aIdx=0;
   return {q:q.q,i:q.i,p:q.p,t:q.t,o:olist,a:aIdx};
 });
}
function gerar(n,modo){
 var id=S.qs.map(function(_,i){return i}),vs=[],seen={};
 for(var v=0;v<n;v++){
  var tries=0,qo,ao,key;
  do{
   qo=(modo!=="a"&&v>0)?shuf(id):id.slice();
   ao=id.map(function(qi){
     var nQ=S.qs[qi].o.length;
     var perm=[];for(var x=0;x<nQ;x++)perm.push(x);
     return (modo!=="q"&&v>0)?shuf(perm):perm;
   });
   key=JSON.stringify([qo,ao]);tries++
  }while(v>0&&seen[key]&&tries<60);
  seen[key]=1;vs.push({qo:qo,ao:ao})
 }
 S.vs=vs;S.vm=modo;S.vn=n;save()
}

/* ===== TABS ===== */
function tabs(){
 var n=document.getElementById("tabs");n.textContent="";
 [["tutorial","Tutorial"],["banco","Banco"],["prova","Prova ("+S.qs.length+")"],["turma","Turma ("+S.turma.students.length+")"],["imprimir","Imprimir"]].forEach(function(t){
  var b=el("button",null,t[1]);b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",tab===t[0]);
  b.onclick=function(){tab=t[0];render()};n.appendChild(b)})
}

/* ===== TUTORIAL ===== */
function vTutorial(v){
 var c = el("div","card");
 c.innerHTML = `
  <h2 style="font-family:Georgia,serif;margin-top:0">Guia Rápido: Sistema de Provas</h2>
  <p class="sub">Este guia ensina a montar a prova e a corrigir as respostas.</p>
  
  <h3>PARTE 1: ELABORAÇÃO (Este arquivo)</h3>
  <ul style="line-height:1.6;padding-left:20px">
    <li><b>Banco de Questões:</b> O banco inicia vazio. Use "Adicionar questão própria" para incluir questões com 2 a 8 alternativas (A–H), disciplina, série, tema, nível e imagem (upload ou colar).</li>
    <li><b>Prova:</b> Defina o título e, se quiser, gere até 50 versões diferentes (embaralhando questões e/ou alternativas) para evitar cola. Cada questão também pode ter alternativas adicionadas/removidas nesta aba.</li>
    <li><b>Turma:</b> Cadastre os alunos manualmente ou cole uma lista (ex: "1. João", "- Maria"). O sistema usará esses nomes para gerar o cartão de cada um.</li>
    <li><b>Imprimir:</b> Configure o cabeçalho (escola, professor). Escolha o modo de impressão (ex: Prova + Cartão, Modo Econômico). <i>Dica: na impressão, ative "Gráficos de plano de fundo" no navegador.</i></li>
  </ul>

  <h3>PARTE 2: CORREÇÃO (Arquivo de Correção)</h3>
  <ul style="line-height:1.6;padding-left:20px">
    <li><b>Ler Cartão:</b> Use a câmera para ler o QR Code do cartão do aluno. O sistema identifica a versão, o nome do aluno e lê as bolinhas marcadas.</li>
    <li><b>Revisão:</b> Confira as respostas lidas na tela. Se necessário, clique nas letras para corrigir manualmente. Clique em "Recalcular nota".</li>
    <li><b>Salvar:</b> Clique em "Salvar nota na turma". O sistema guardará a nota e o número de acertos.</li>
    <li><b>Notas:</b> Veja a média da turma e envie os resultados individuais ou gerais via WhatsApp com um clique.</li>
  </ul>

  <p style="margin-top:20px;padding-top:10px;border-top:1px dashed var(--rule);font-size:14px;color:var(--mute)">
    <b>Dica importante:</b> Para a câmera funcionar no celular, o arquivo precisa estar em um servidor seguro (HTTPS) ou use a opção "Tirar foto do cartão". Limpar o cache do navegador pode apagar os dados salvos, então sempre exporte o PDF da prova e das notas.
  </p>
 `;
 v.appendChild(c);
}

/* ===== BANCO ===== */
function vBanco(v){
 var pool=todas();
 var totalCount=pool.length;
 var discos=uniq(pool.map(function(b){return b.d||""}).filter(Boolean));
 var seriesList=uniq(pool.map(function(b){return b.s||""}).filter(Boolean));
 var temas=uniq(pool.map(function(b){return b.t||""}).filter(Boolean));
 var discsOpts=discos.map(function(d){
  var n=pool.filter(function(b){return (b.d||"")===d}).length;
  return {v:d, l:d+" ("+n+")"};
 });
 var seriesOpts=seriesList.map(function(s){
  var n=pool.filter(function(b){return (b.s||"")===s}).length;
  return {v:s, l:s+" ("+n+")"};
 });
 var temasOpts=temas.map(function(t){
  var n=pool.filter(function(b){return (b.t||"")===t}).length;
  return {v:t, l:t+" ("+n+")"};
 });
 var nvOpts=NIVEIS.map(function(nv){
  var n=pool.filter(function(b){return b.n===nv}).length;
  return {v:nv, l:nv+" ("+n+")"};
 });

 var c=el("div","card"),f=el("div","filters");
 var wv=el("div");wv.appendChild(el("label",null,"Nível"));
 wv.appendChild(sel(nvOpts,F.v,"Todos os níveis ("+totalCount+")",function(x){F.v=x;render()}));
 var wd=el("div");wd.appendChild(el("label",null,"Disciplina"));
 wd.appendChild(sel(discsOpts,F.d,"Todas as disciplinas ("+totalCount+")",function(x){F.d=x;render()}));
 var ws=el("div");ws.appendChild(el("label",null,"Série"));
 ws.appendChild(sel(seriesOpts,F.serie,"Todas as séries ("+totalCount+")",function(x){F.serie=x;render()}));
 var w1=el("div");w1.appendChild(el("label",null,"Tema"));

 function readImageFile(file){
   if(!file) return;
   if(!/^image\//.test(file.type)){ alert("Selecione um arquivo de imagem (PNG ou JPG)."); return; }
   var rd = new FileReader();
   rd.onload = function(ev){

       var maxW = 1400;
       var sc = Math.min(1, maxW / im.naturalWidth);
       var cv = document.createElement("canvas");
       cv.width = Math.max(1, Math.round(im.naturalWidth * sc));
       cv.height = Math.max(1, Math.round(im.naturalHeight * sc));
       var cx = cv.getContext("2d");
       cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
       cx.drawImage(im, 0, 0, cv.width, cv.height);
       var dataURL = cv.toDataURL("image/png");
       if(dataURL.length > 700000){ dataURL = cv.toDataURL("image/jpeg", 0.85); }
       if(dataURL.length > 2000000){ alert("A imagem é muito grande (mesmo comprimida). Use uma imagem menor que ~2 MB."); return; }
       novaImg = dataURL;
       imgPreview.src = dataURL;
       imgPreviewWrap.style.display = "block";
       btnRemoveImg.style.display = "";
     };
     im.onerror = function(){ alert("Não foi possível ler a imagem."); };
     im.src = ev.target.result;
   };
   rd.onerror = function(){ alert("Falha ao carregar o arquivo."); };
   rd.readAsDataURL(file);
 }

/* ===== GEOMETRIA DO CARTÃO =====
   Ajustes de legibilidade:
   - QR: 60 mm (era 50 mm) — 44% mais área
   - Separação vertical entre círculos: 10 mm (era 7,2 mm) → gap 3,4 mm (era 0,6 mm)
   - Separação horizontal adaptada ao nº de alternativas (GEOM abaixo)
   - Capacidade: 18 linhas × 4 colunas = 72 questões por cartão
*/
var SH={
  W:190, H:270,
  FID:[[5,5],[185,5],[185,265],[5,265]],
  QR:{x:118, y:12, s:60},
  ROWS:18, COLS:4,
  Y0:82, PY:10,
  BR:3.3,
  GEOM:{
    4:{cols:4, cw:45,  bp:9.5,  off:11},
    6:{cols:3, cw:60,  bp:8.8,  off:11},
    8:{cols:2, cw:90,  bp:10.5, off:11}
  }
};
function cardGeom(nAlt){
  if(nAlt<=4) return SH.GEOM[4];
  if(nAlt<=6) return SH.GEOM[6];
  return SH.GEOM[8];
}
function cardPos(i,n,g){
  g = g || cardGeom(4);
  var C = Math.min(g.cols, Math.ceil(n/SH.ROWS));
  var R = Math.ceil(n/C);
  var col = Math.floor(i/R);
  var row = i%R;
  var x0 = 10 + (g.cols - C)*g.cw/2 + col*g.cw;
  return {
    x0: x0,
    cy: SH.Y0 + row*SH.PY,
    bx: function(j){ return x0 + g.off + j*g.bp; }
  };
}
function escX(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function omrKey(id,n){var h=2166136261,i;for(i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619)}var s=h>>>0,k=[];for(i=0;i<n;i++){s=(Math.imul(s,1664525)+1013904223)>>>0;k.push(s>>>24)}return k}
/* 1 byte por questão (suporta índices 0–255, cobrindo A–H) */
function omrPack(a,id){
 var bytes=a.map(function(x){return x&255});
 var k=omrKey(id,bytes.length),s="";
 for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]^k[i]);
 return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")
}
function exId(){
 var N=nver(),k=(S.title||"")+"#"+N,x;
 for(x=0;x<N;x++){var Q=ver(x);k+="|"+Q.map(function(q){return q.a+":"+q.p+":"+q.o.length+":"+q.q}).join("^")}
 var h=2166136261;for(var i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)}
 return (h>>>0).toString(36)
}
function cardSvg(id,vn,nv,n,title,key,pts,student,widthMM,heightMM,nAlt){
 widthMM=widthMM||SH.W; heightMM=heightMM||SH.H; nAlt=nAlt||4;
 var g = cardGeom(nAlt);
 var pq=pts.map(function(x){return Math.round(x*4)}),pl=pts.every(function(x){return x===1})?"":pq.every(function(x){return x===pq[0]})?"e"+pq[0].toString(36):(pq.every(function(x){return x<36})?"c"+pq.map(function(x){return x.toString(36)}).join(""):"l"+pq.map(function(x){return x.toString(36)}).join(","));
 var dataArr=["CP2",id,vn+"-"+nv,n,nAlt,omrPack(key,id),pl];
 if(student)dataArr.push(encodeURIComponent(student));
 var q=qrcode(0,"L");q.addData(dataArr.join("|"));q.make();
 var m=q.getModuleCount(),ms=SH.QR.s/(m+8),d="";
 for(var r=0;r<m;r++)for(var c=0;c<m;c++)if(q.isDark(r,c))d+="M"+((c+4)*ms).toFixed(3)+" "+((r+4)*ms).toFixed(3)+"h"+ms.toFixed(3)+"v"+ms.toFixed(3)+"h-"+ms.toFixed(3)+"z";
 var s='<svg class="sheet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+SH.W+' '+SH.H+'" width="'+widthMM+'mm" height="'+heightMM+'mm" preserveAspectRatio="xMidYMid meet" style="display:block;background:#fff" role="img" aria-label="Cartão-resposta">';
 s+='<rect width="'+SH.W+'" height="'+SH.H+'" fill="#fff"/>';

   '</div>';
 h+='<h2 style="font:700 16px Georgia,serif;margin:0 0 2mm">'+escX(title||"Prova")+(N>1?" — Prova "+vn:"")+'</h2>';
 head.innerHTML=h;c.appendChild(head);

 var ex=el("div","eco-exam");
 var html='<ol>';
 Q.forEach(function(q){
  html+='<li>'+
   '<div>'+escX(q.q||"(sem enunciado)")+'</div>'+
   (q.i?'<img class="qimg" src="'+q.i+'" alt="Figura"/>':'')+
   altsHTML(q)+
  '</li>';
 });
 html+='</ol>';
 ex.innerHTML=html;
 c.appendChild(ex);

 return c
}

 atualizarTitulo();
 tabs();
 var v=document.getElementById("view");v.textContent="";
 ({tutorial:vTutorial,banco:vBanco,prova:vProva,turma:vTurma,imprimir:vImprimir})[tab](v);
}
load();render();
</script>
